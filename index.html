<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Study — VRインスタレーション Phase 1</title>
    <style>
      :root { --bg: #101014; --panel: #17171d; --border: #2a2a33; --text: #d8d8e0; --dim: #7a7a88; --accent: #5eead4; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        max-width: 640px; padding: 32px 20px 64px; margin-inline: auto; line-height: 1.7; }
      h1 { font-size: 22px; }
      h2 { font-size: 15px; color: var(--dim); margin-top: 32px; font-weight: 600; }
      a.card { display: block; background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; padding: 14px 16px; margin: 10px 0; text-decoration: none; color: var(--text); }
      a.card:active { background: var(--border); }
      a.card strong { color: var(--accent); }
      a.card span { display: block; font-size: 13px; color: var(--dim); }
      p.note { font-size: 13px; color: var(--dim); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>Shader Study</h1>
    <p class="note">VRインスタレーション Phase 1 のシェーダー学習サンドボックス。ロードマップ全体は
      <a href="https://github.com/ktymRyich/shader-study/blob/main/STUDY_GUIDE.md">STUDY_GUIDE.md</a> を参照。</p>

    <h2>iPad / 出先での学習</h2>
    <a class="card" href="./playground/">
      <strong>Shader Playground</strong>
      <span>ブラウザ内エディタで fragment shader を書いて即実行。00/01/02/05 のプリセット入り。編集内容は端末に自動保存される</span>
    </a>

    <h2>モジュールのデモ</h2>
    <a class="card" href="./00-hello-shader/">
      <strong>00 - Hello Shader</strong>
      <span>uniform / varying の配線を確認する最初のデモ</span>
    </a>
    <p class="note">01 以降のモジュールは「自分で配線を書く」課題のため、完成したものからここに追加していく。</p>
  </body>
</html>
