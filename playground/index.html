<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Shader Playground</title>
    <style>
      :root {
        --bg: #101014;
        --panel: #17171d;
        --border: #2a2a33;
        --text: #d8d8e0;
        --dim: #7a7a88;
        --accent: #5eead4;
        --error: #f87171;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
      body { display: flex; flex-direction: column; }

      header {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
      }
      header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
      header a { color: var(--dim); font-size: 12px; text-decoration: none; margin-left: auto; }
      select, button {
        background: var(--bg); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 10px; font-size: 13px;
      }
      button:active { background: var(--border); }
      #status { font-size: 12px; color: var(--accent); }
      #status.error { color: var(--error); }

      main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      /* 横長画面 (iPad横・PC) では左右分割 */
      @media (min-aspect-ratio: 5/4) {
        main { flex-direction: row; }
        #view-pane, #edit-pane { width: 50%; height: 100%; }
      }
      #view-pane { position: relative; flex: 1; min-height: 34%; background: #000; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #error-box {
        position: absolute; left: 0; right: 0; bottom: 0; max-height: 45%; overflow: auto;
        background: rgba(20, 8, 8, 0.92); color: var(--error);
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
        padding: 8px 12px; white-space: pre-wrap; display: none;
      }

      #edit-pane { flex: 1; display: flex; min-height: 0; background: var(--panel); }
      #gutter {
        padding: 10px 6px 10px 10px; text-align: right; color: var(--dim); user-select: none;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; line-height: 1.45;
        overflow: hidden; white-space: pre; border-right: 1px solid var(--border);
      }
      #editor {
        flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 16px; /* 16px 未満だと iPad Safari がフォーカス時に自動ズームする */
        line-height: 1.45; padding: 10px; white-space: pre; overflow-wrap: normal; overflow-x: auto;
        -webkit-text-size-adjust: 100%;
      }

      /* ---- 関数リファレンスパネル ---- */
      #ref-panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
        background: var(--panel); border-left: 1px solid var(--border);
        display: none; flex-direction: column; z-index: 10;
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.4);
      }
      #ref-panel.open { display: flex; }
      #ref-head {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      #ref-head strong { font-size: 14px; }
      #ref-close { margin-left: auto; font-size: 16px; line-height: 1; }
      #ref-search {
        margin: 10px 12px 0; padding: 8px 10px; font-size: 16px;
        background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
      }
      #ref-list { flex: 1; overflow-y: auto; padding: 10px 12px 24px; -webkit-overflow-scrolling: touch; }
      #ref-list h3 { font-size: 12px; color: var(--dim); margin: 18px 0 6px; font-weight: 600; }
      .ref-item { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
      .ref-item code {
        display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
        color: var(--accent); margin-bottom: 4px; white-space: pre-wrap;
      }
      .ref-item p { margin: 0; font-size: 13px; line-height: 1.6; }
      .ref-item p.basics-title { color: var(--accent); font-weight: 600; margin-bottom: 4px; font-size: 13px; }
      #ref-list a { color: var(--accent); font-size: 13px; display: block; margin: 6px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Shader Playground</h1>
      <select id="preset-select" aria-label="プリセット選択"></select>
      <button id="reset-btn" type="button">リセット</button>
      <button id="ref-btn" type="button">関数リファレンス</button>
      <span id="status">OK</span>
      <a href="../">← 目次へ</a>
    </header>
    <aside id="ref-panel" aria-label="GLSL 関数リファレンス">
      <div id="ref-head">
        <strong>GLSL リファレンス</strong>
        <button id="ref-close" type="button" aria-label="閉じる">×</button>
      </div>
      <input id="ref-search" type="search" placeholder="関数名や説明で絞り込み (例: mix, 補間)"
        autocapitalize="off" autocorrect="off" spellcheck="false" />
      <div id="ref-list"></div>
    </aside>
    <main>
      <div id="view-pane">
        <canvas id="glcanvas"></canvas>
        <div id="error-box"></div>
      </div>
      <div id="edit-pane">
        <div id="gutter">1</div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off" aria-label="GLSL エディタ"></textarea>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
