<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>3D Shader Playground</title>
    <style>
      :root {
        --bg: #101014;
        --panel: #17171d;
        --border: #2a2a33;
        --text: #d8d8e0;
        --dim: #7a7a88;
        --accent: #5eead4;
        --error: #f87171;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
      body { display: flex; flex-direction: column; }

      header {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
      }
      header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
      header a { color: var(--dim); font-size: 12px; text-decoration: none; margin-left: auto; }
      select, button {
        background: var(--bg); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 10px; font-size: 13px;
      }
      button:active { background: var(--border); }
      button.tab.active { border-color: var(--accent); color: var(--accent); }
      #status { font-size: 12px; color: var(--accent); }
      #status.error { color: var(--error); }

      main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      @media (min-aspect-ratio: 5/4) {
        main { flex-direction: row; }
        #view-pane, #edit-pane { width: 50%; height: 100%; }
      }
      #view-pane { position: relative; flex: 1; min-height: 34%; background: #000; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #error-box {
        position: absolute; left: 0; right: 0; bottom: 0; max-height: 45%; overflow: auto;
        background: rgba(20, 8, 8, 0.92); color: var(--error);
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
        padding: 8px 12px; white-space: pre-wrap; display: none;
      }

      #edit-pane { flex: 1; display: flex; min-height: 0; background: var(--panel); }
      #gutter {
        padding: 10px 6px 10px 10px; text-align: right; color: var(--dim); user-select: none;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; line-height: 1.45;
        overflow: hidden; white-space: pre; border-right: 1px solid var(--border);
      }
      #editor {
        flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 16px; line-height: 1.45; padding: 10px; white-space: pre;
        overflow-wrap: normal; overflow-x: auto; -webkit-text-size-adjust: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>3D Playground</h1>
      <select id="preset-select" aria-label="プリセット選択"></select>
      <button id="tab-vertex" class="tab active" type="button">vertex</button>
      <button id="tab-fragment" class="tab" type="button">fragment</button>
      <button id="reset-btn" type="button">リセット</button>
      <span id="status">OK</span>
      <a href="../">← 目次へ</a>
    </header>
    <main>
      <div id="view-pane">
        <canvas id="glcanvas"></canvas>
        <div id="error-box"></div>
      </div>
      <div id="edit-pane">
        <div id="gutter">1</div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off" aria-label="GLSL エディタ"></textarea>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
